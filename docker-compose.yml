services:
  postgres:
    image: postgres:17
    container_name: aw-pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: stackduel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
 
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    container_name: aw-azurite
    ports:
      - "10000:10000"
    volumes:
      - azuritedata:/data
    command: "azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck"

  rabbitmq:
    image: heidiks/rabbitmq-delayed-message-exchange:4.0.7-management
    container_name: aw-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
 
volumes:
  pgdata:
  rabbitmqdata:
  azuritedata: