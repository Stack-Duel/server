name: Publish Image

on:
  workflow_call:
    inputs:
      image-name:
        required: false
        type: string
        default: "stackduel-api"
      dotnet-version:
        required: false
        type: string
        default: "11.0"
    outputs:
      image:
        description: "Immutable image reference pinned by digest."
        value: ${{ jobs.publish.outputs.image }}
      digest:
        description: "Digest of the published manifest."
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pin.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image repository
        id: repo
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "repository=ghcr.io/${owner}/${{ inputs.image-name }}" >> "$GITHUB_OUTPUT"

      - name: Collect image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DOTNET_VERSION=${{ inputs.dotnet-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin image to digest
        id: pin
        run: echo "image=${{ steps.repo.outputs.repository }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Summarize
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${{ steps.pin.outputs.image }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
