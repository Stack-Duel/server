name: Build and Test

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: "11.0.x"
      verify:
        required: false
        type: boolean
        default: true
      upload-artifact:
        required: false
        type: boolean
        default: false
      upload-migration-artifacts:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore StackDuel.slnx

      - name: Verify formatting
        if: ${{ inputs.verify }}
        run: dotnet format StackDuel.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build StackDuel.slnx --configuration Release --no-restore

      - name: Run tests
        if: ${{ inputs.verify }}
        run: dotnet test StackDuel.slnx --configuration Release --no-build --verbosity normal

      - name: Publish API
        if: ${{ inputs.upload-artifact }}
        run: dotnet publish StackDuel.Api/StackDuel.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload API artifact
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ./publish
          if-no-files-found: error

      - name: Publish the Data CLI
        if: ${{ inputs.upload-migration-artifacts }}
        run: dotnet publish Data/Data.csproj --configuration Release --no-build --output ./data-publish

      - name: Upload the Data CLI artifact
        if: ${{ inputs.upload-migration-artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: data-cli
          path: ./data-publish
          if-no-files-found: error
