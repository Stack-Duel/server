name: Build and Test

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: "11.0.x"
      verify:
        required: false
        type: boolean
        default: true
      upload-artifact:
        required: false
        type: boolean
        default: false
      upload-migration-artifacts:
        required: false
        type: boolean
        default: false
      publish-container:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore StackDuel.slnx

      - name: Verify formatting
        if: ${{ inputs.verify }}
        run: dotnet format StackDuel.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build StackDuel.slnx --configuration Release --no-restore

      - name: Run tests
        if: ${{ inputs.verify }}
        run: dotnet test StackDuel.slnx --configuration Release --no-build --verbosity normal

      - name: Publish API
        if: ${{ inputs.upload-artifact }}
        run: dotnet publish StackDuel.Api/StackDuel.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload API artifact
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ./publish
          if-no-files-found: error

      - name: Install EF Core tools
        if: ${{ inputs.upload-migration-artifacts }}
        run: dotnet tool install --global dotnet-ef

      - name: Create migrations bundle
        if: ${{ inputs.upload-migration-artifacts }}
        run: |
          dotnet ef migrations bundle \
            --configuration Release \
            --context StackDuelDbContext \
            --project StackDuel.Infrastructure \
            --startup-project StackDuel.Api \
            --output ./migrations-bundle/efbundle \
            --force

      - name: Upload migrations bundle artifact
        if: ${{ inputs.upload-migration-artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: migrations-bundle
          path: ./migrations-bundle
          if-no-files-found: error

      - name: Publish seeder
        if: ${{ inputs.upload-migration-artifacts }}
        run: dotnet publish StackDuel.Seeder/StackDuel.Seeder.csproj --configuration Release --output ./seeder-publish

      - name: Upload seeder artifact
        if: ${{ inputs.upload-migration-artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: seeder
          path: ./seeder-publish
          if-no-files-found: error

      - name: Set up Docker Buildx
        if: ${{ inputs.publish-container }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.publish-container }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        if: ${{ inputs.publish-container }}
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')

          TAGS="$IMAGE:${GITHUB_SHA}"

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAGS="$TAGS,$IMAGE:main"
          fi

          docker buildx build \
            --file StackDuel.Api/Dockerfile \
            --tag "$IMAGE:${GITHUB_SHA}" \
            $(if [ "$GITHUB_REF" = "refs/heads/main" ]; then echo --tag "$IMAGE:main"; fi) \
            --push \
            .
