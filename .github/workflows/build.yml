name: Build and Test

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: "11.0.x"
      verify:
        required: false
        type: boolean
        default: true
      upload-artifact:
        required: false
        type: boolean
        default: false
      upload-migration-artifacts:
        required: false
        type: boolean
        default: false
      container:
        description: "none = skip Docker entirely, build = build the image without pushing, push = build and push to GHCR"
        required: false
        type: string
        default: none
    outputs:
      image:
        description: "Fully qualified image reference that was pushed, empty unless container was 'push'"
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image-ref.outputs.pushed }}

    steps:
      - name: Validate container input
        if: ${{ !contains(fromJSON('["none", "build", "push"]'), inputs.container) }}
        env:
          CONTAINER: ${{ inputs.container }}
        run: |
          echo "container must be one of none, build, push. Got '$CONTAINER'."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore StackDuel.slnx

      - name: Verify formatting
        if: ${{ inputs.verify }}
        run: dotnet format StackDuel.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build StackDuel.slnx --configuration Release --no-restore

      - name: Run tests
        if: ${{ inputs.verify }}
        run: dotnet test StackDuel.slnx --configuration Release --no-build --verbosity normal

      - name: Publish API
        if: ${{ inputs.upload-artifact }}
        run: dotnet publish StackDuel.Api/StackDuel.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload API artifact
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ./publish
          if-no-files-found: error

      - name: Install EF Core tools
        if: ${{ inputs.upload-migration-artifacts }}
        run: dotnet tool install --global dotnet-ef

      - name: Create migrations bundle
        if: ${{ inputs.upload-migration-artifacts }}
        run: |
          dotnet ef migrations bundle \
            --configuration Release \
            --context StackDuelDbContext \
            --project StackDuel.Infrastructure \
            --startup-project StackDuel.Api \
            --output ./migrations-bundle/efbundle \
            --force

      - name: Upload migrations bundle artifact
        if: ${{ inputs.upload-migration-artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: migrations-bundle
          path: ./migrations-bundle
          if-no-files-found: error

      - name: Publish seeder
        if: ${{ inputs.upload-migration-artifacts }}
        run: dotnet publish StackDuel.Seeder/StackDuel.Seeder.csproj --configuration Release --output ./seeder-publish

      - name: Upload seeder artifact
        if: ${{ inputs.upload-migration-artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: seeder
          path: ./seeder-publish
          if-no-files-found: error

      - name: Resolve image reference
        id: image-ref
        if: ${{ inputs.container != 'none' }}
        env:
          REPOSITORY: ${{ github.repository }}
          CONTAINER: ${{ inputs.container }}
        run: |
          set -euo pipefail

          registry_path="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          commit_tag="$registry_path:${GITHUB_SHA}"

          tags="$commit_tag"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tags="$tags,$registry_path:main"
          fi

          echo "tags=$tags" >> "$GITHUB_OUTPUT"

          if [ "$CONTAINER" = "push" ]; then
            echo "pushed=$commit_tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: ${{ inputs.container != 'none' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.container == 'push' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image
        if: ${{ inputs.container != 'none' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: StackDuel.Api/Dockerfile
          push: ${{ inputs.container == 'push' }}
          tags: ${{ steps.image-ref.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
