name: Build and Test

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: "10.0.x"
      verify:
        required: false
        type: boolean
        default: true
      upload-artifact:
        required: false
        type: boolean
        default: false
      upload-migration-artifacts:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore StackDuel.slnx

      - name: Verify formatting
        if: ${{ inputs.verify }}
        run: dotnet format StackDuel.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build StackDuel.slnx --configuration Release --no-restore

      - name: Run tests
        if: ${{ inputs.verify }}
        run: dotnet test StackDuel.slnx --configuration Release --no-build --verbosity normal

      - name: Publish API
        if: ${{ inputs.upload-artifact }}
        run: dotnet publish StackDuel.Api/StackDuel.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload API artifact
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ./publish
          if-no-files-found: error

      - name: Install EF Core tools
        if: ${{ inputs.upload-migration-artifacts }}
        run: dotnet tool install --global dotnet-ef

      - name: Create migrations bundle
        if: ${{ inputs.upload-migration-artifacts }}
        run: |
          dotnet ef migrations bundle \
            --configuration Release \
            --context StackDuelDbContext \
            --project StackDuel.Infrastructure \
            --startup-project StackDuel.Api \
            --output ./migrations-bundle/efbundle \
            --force

      - name: Upload migrations bundle artifact
        if: ${{ inputs.upload-migration-artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: migrations-bundle
          path: ./migrations-bundle
          if-no-files-found: error

      - name: Publish seeder
        if: ${{ inputs.upload-migration-artifacts }}
        run: dotnet publish StackDuel.Seeder/StackDuel.Seeder.csproj --configuration Release --output ./seeder-publish

      - name: Upload seeder artifact
        if: ${{ inputs.upload-migration-artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: seeder
          path: ./seeder-publish
          if-no-files-found: error
