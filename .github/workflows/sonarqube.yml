name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    env:
      # Sources with no hand-written logic to test, so a coverage requirement on them would
      # measure nothing:
      #   Migrations, Seeders, obj/**, *.g.cs, *.Designer.cs -- generated or static data
      #   Program.cs, *ServiceRegistration.cs, *Options.cs   -- composition root / config binding
      #   Dtos/**, *DbContext.cs, Persistence/Configuration  -- records and declarative EF mapping
      # Kept in sync with coverage.runsettings. Whole-file *analysis* exclusions (migrations,
      # seeders) live in Directory.Build.props. Written on one line: Sonar splits on commas.
      COVERAGE_EXCLUSIONS: "**/Migrations/**/*.cs,**/Persistence/Seeders/**/*.cs,**/obj/**/*.cs,**/*.g.cs,**/*.generated.cs,**/*.Designer.cs,**/Program.cs,**/*ServiceRegistration.cs,**/*Options.cs,**/Dtos/**/*.cs,**/*DbContext.cs,**/Persistence/Configuration/**/*.cs,**/LoggingEventIds.cs,StackDuel.Seeder/**/*.cs"
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: "zulu" # Alternative distribution options are available.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin `
            /k:"Stack-Duel_server" `
            /o:"stack-duel" `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" `
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" `
            /d:sonar.coverage.exclusions="$env:COVERAGE_EXCLUSIONS"
          dotnet build
          dotnet test --no-build --settings coverage.runsettings --results-directory coverage
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
