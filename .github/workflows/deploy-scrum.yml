name: Deploy Scrum

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_CONTAINER_APP: "ca-awapi-scrum-01"
  AZURE_RESOURCE_GROUP: "rg-aw-scrum-01"
  DOTNET_VERSION: "11.0.x"

concurrency:
  group: deploy-scrum
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      container: push

  migrate:
    runs-on: ubuntu-latest
    needs: build
    environment: Scrum

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Apply schema, reference, and content scripts
        run: dotnet run --project StackDuel.Data -- migrate
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build, migrate]
    environment: Scrum
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Verify image reference
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          if [ -z "$IMAGE" ]; then
            echo "Build produced no image reference. Was it called with container: push?"
            exit 1
          fi

      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update container app image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail

          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE" \
            --output none

      - name: Report deployed revision
        run: |
          set -euo pipefail

          fqdn=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)

          echo "Deployed to https://$fqdn" >> "$GITHUB_STEP_SUMMARY"
