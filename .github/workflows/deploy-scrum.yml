name: Deploy Scrum

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: "app-awapi-scrum-centralus-03"
  DOTNET_VERSION: "11.0.x"

concurrency:
  group: deploy-scrum
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      container: push
      upload-migration-artifacts: true

  migrate:
    runs-on: ubuntu-latest
    needs: build
    environment: Scrum

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download migrations bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: migrations-bundle
          path: ./migrations-bundle

      - name: Run migrations
        run: |
          chmod +x ./migrations-bundle/efbundle
          ./migrations-bundle/efbundle
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}

  seed:
    runs-on: ubuntu-latest
    needs: migrate
    environment: Scrum

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download seeder artifact
        uses: actions/download-artifact@v4
        with:
          name: seeder
          path: ./seeder-publish

      - name: Run static seed
        run: dotnet ./seeder-publish/StackDuel.Seeder.dll --static
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build, seed]
    environment:
      name: Scrum
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Deploy container to Azure App Service
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ needs.build.outputs.image }}
