name: Deploy Production

on:
  push:
    branches:
      - release/**
  workflow_dispatch:

env:
  AZURE_WEBAPP_PACKAGE_PATH: "./publish"

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      upload-artifact: true
      verify: false

  migrate:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download migrations bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: migrations-bundle
          path: ./migrations-bundle

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Open DB firewall for this runner
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          az postgres flexible-server firewall-rule create \
            --resource-group "${{ secrets.AZURE_POSTGRES_RESOURCE_GROUP }}" \
            --server-name "${{ secrets.AZURE_POSTGRES_SERVER_NAME }}" \
            --name "gh-migrate-${{ github.run_id }}" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP"

      - name: Run migrations
        run: |
          chmod +x ./migrations-bundle/efbundle
          ./migrations-bundle/efbundle
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}

      - name: Close DB firewall for this runner
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "${{ secrets.AZURE_POSTGRES_RESOURCE_GROUP }}" \
            --server-name "${{ secrets.AZURE_POSTGRES_SERVER_NAME }}" \
            --name "gh-migrate-${{ github.run_id }}" \
            --yes

  seed:
    runs-on: ubuntu-latest
    needs: migrate
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download seeder artifact
        uses: actions/download-artifact@v4
        with:
          name: seeder
          path: ./seeder-publish

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Open DB firewall for this runner
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          az postgres flexible-server firewall-rule create \
            --resource-group "${{ secrets.AZURE_POSTGRES_RESOURCE_GROUP }}" \
            --server-name "${{ secrets.AZURE_POSTGRES_SERVER_NAME }}" \
            --name "gh-seed-${{ github.run_id }}" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP"

      - name: Run static seed
        run: dotnet ./seeder-publish/StackDuel.Seeder.dll -- --static
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}

      - name: Close DB firewall for this runner
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "${{ secrets.AZURE_POSTGRES_RESOURCE_GROUP }}" \
            --server-name "${{ secrets.AZURE_POSTGRES_SERVER_NAME }}" \
            --name "gh-seed-${{ github.run_id }}" \
            --yes

  deploy:
    runs-on: ubuntu-latest
    needs: seed
    if: ${{ always() && needs.seed.result == 'success' }}
    environment:
      name: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
